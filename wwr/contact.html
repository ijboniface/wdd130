<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting Adventures</title>

    <meta name="description"
      content="Contact details and a form for user enquiries about White Water Rafting Adventures and its services.">

    <meta name="author" content="Ikechukwu Jonathan Boniface">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>

        <img src="images/logo.png" alt="White Water Rafting Logo" class="logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>

    </header>

    <main>

        <section class="contact-info">

            <h1>White Water Rafting Company</h1>

            <p>Presidential Avenue</p>
            <p>Ikeja, Lagos</p>
            <p>+2348109051390</p>
            <p>
                <a href="mailto:info@whitewater.com">
                    iboniface@byupathway.com
                </a>
            </p>

        </section>

        <section class="contact-grid">

            <div class="map-container">

                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d63409.83098582913!2d3.3162494220163503!3d6.632706960008569!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1780839310341!5m2!1sen!2sng"
                  loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade">
                </iframe>

            </div>

            <form class="contact-form" action="#" method="post">

                <div class="form-row">
                    <label for="name">Name</label>

                    <input type="text" id="name" name="name" placeholder="Placeholder" required>
                </div>

                <div class="form-row">
                    <label for="email">Email</label>

                    <input type="email" id="email" name="email" placeholder="Placeholder" required>
                </div>

                <div class="form-row purpose-row">

                    <label>Message Purpose</label>

                    <div class="radio-options">

                        <label>
                            <input type="radio" name="purpose" value="general" required>
                            General Inquiry
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="website">
                            Website Suggestion
                        </label>

                    </div>

                </div>

                <div class="message-group">

                    <label for="message">Message</label>

                    <textarea id="message" name="message" rows="4" placeholder="Type here"
                      required></textarea>

                </div>

                <div class="newsletter">

                    <label>
                        <input type="checkbox" name="newsletter">
                        Please Subscribe me to the monthly newsletter
                    </label>

                </div>

                <button type="submit">
                    Get In Touch!
                </button>

            </form>

        </section>

        <section class="employees">

            <h2>We Are Here to Serve You</h2>

            <div class="employee-cards">

                <figure>
                    <img src="images/manager.jpg" alt="Sarah Johnson, Operations Manager">
                    <figcaption>Sarah Johnson, Operations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/guide.jpg" alt="David Okafor, Lead River Guide">
                    <figcaption>David Okafor, Lead River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/customer-service.jpg"
                      alt="Williams Roberts, Customer Service Specialist">
                    <figcaption>Williams Roberts, Customer Service Specialist</figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <div class="footer-text">
            ©️2026 🍀 Exciting Expeditions 🍀 I.J. Boniface
        </div>

        <div class="footer-icons">

            <a href="https://facebook.com">
                <img src="images/facebook.jpg" alt="Facebook">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.jpg" alt="LinkedIn">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.jpg" alt="Instagram">
            </a>

        </div>

    </footer>

</body>

</html>
